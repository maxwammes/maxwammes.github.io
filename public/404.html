<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Max Wammes</title>
    <script>
      // GitHub Pages SPA fallback (rafgraph technique).
      // Encodes the deep path into a query string and redirects to /,
      // where index.html restores it via history.replaceState.
      (function () {
        var segmentCount = 0;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
